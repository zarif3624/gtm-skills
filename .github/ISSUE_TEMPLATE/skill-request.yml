name: Skill request
description: Propose a sales or GTM workflow for the collection
title: "[Skill]: "
labels: [enhancement, skill-request]
body:
  - type: textarea
    attributes:
      label: Job to be done
      description: What should a user be able to ask an agent to do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Useful output
      description: What practical artifact should the skill produce?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Risks and edge cases
      description: What could an agent get wrong or fabricate?
  - type: textarea
    attributes:
      label: Example prompt
      description: Provide a realistic, fictional example.
